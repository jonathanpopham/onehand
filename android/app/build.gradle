plugins {
    id 'com.android.application' version '8.13.0'
}

android {
    namespace 'com.onehand.remote'
    compileSdk 36

    defaultConfig {
        applicationId "com.onehand.remote"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    // Play Store signing: set these env vars (see scripts/build_android.sh)
    def ksFile = System.getenv("ONEHAND_KEYSTORE")
    def ksPass = System.getenv("ONEHAND_KEYSTORE_PASS")

    signingConfigs {
        if (ksFile != null && ksPass != null) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias "onehand"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile != null && ksPass != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
